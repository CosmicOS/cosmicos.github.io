name: CosmicOS
encoding: utf-8

# ── WHAT A LINK TO THIS SITE LOOKS LIKE SOMEWHERE ELSE ────────────────────────────────────────────
# A link is posted before it is read. With none of this, every paste of the site into Slack, Discord,
# Bluesky, Mastodon or a group chat rendered as a bare URL — no title, no picture, nothing saying
# there was a book on the other end. `_includes/header.html` builds the tags from these; a page may
# override any of them in its own front matter.
#
# `url` is REQUIRED and must be absolute with its scheme: Open Graph has no notion of a relative
# path, and a scraper handed `/images/og-second-book.jpg` fetches nothing. It is the canonical origin
# only — `baseurl` above is still what joins on the front, so a move back to a project page (the
# commented-out `/cosmicos`) needs no change here.
url: https://cosmicos.github.io
tagline: an open source contact message
# THE FALLBACK, AND IT IS THE PROJECT'S AND NOT THE STORY'S. It is what a page that sets no
# `description` of its own gets — the posts, the gate pages, anything added later. The story's pitch
# lives in index.html's own front matter instead: it was here first, which handed every 2014 blog
# post and every logic-gate page a description announcing a book about lighthouse keepers.
description: >-
  CosmicOS is an open source message designed to be readable by someone who shares no language,
  number or history with us — a programming language that teaches itself from four symbols up.
# 1200x630. Rebuild with `node scripts/build-og.js` after editing scripts/og-card.html.
og_image: /images/og-second-book.jpg
# DESCRIBES THE CARD AS IT NOW STANDS. It said "The Second Book" for a while after the card had
# already been retitled — which nobody sighted would ever have caught, because this is the one tag
# here that is read aloud rather than looked at. Re-check it whenever scripts/og-card.html changes.
og_image_alt: >-
  CosmicOS — the earth's night limb, over the opening run of the message's four symbols.

markdown: kramdown
highlighter: rouge
baseurl: 
#baseurl: /cosmicos
include: [_equals_.svg,  _gt_.svg,  _lambda_.svg,  _lt_.svg]
kramdown:
  extensions: ["no_intra_emphasis", "fenced_code_blocks", "autolink", "tables", "with_toc_data"]
  syntax_highlighter_opts:
    default_lang: haskell

# SETTING `exclude` REPLACES JEKYLL'S DEFAULT LIST, it does not add to it — so everything Jekyll
# would have excluded on its own has to be named again here, or it ships. The first block below IS
# Jekyll's own default list. It looks redundant and is not.
#
# js/notes.js is the LOCAL note-taking widget and is deliberately not published: scripts/notes-server.py
# serves it from the repo and injects its script tag into the pages it hands over, so the built site
# has no reference to it and no 404 to fire.
exclude:
  # Jekyll's defaults, restored (see above)
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # the repo's own
  - scripts
  - plans
  - js/notes.js
  # the test harness and its trappings: nothing a reader of the site ever asks for
  - tests
  - test-results
  - playwright-report
  - playwright.config.js
  - package.json
  - package-lock.json
  # local scratch: the shared note queue, and an rvm-era serve helper
  - notes.db
  - go.sh
